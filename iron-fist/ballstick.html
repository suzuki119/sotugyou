<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ボールスティック検証</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1218; color: #e6eef5; font-family: -apple-system, "Hiragino Sans", sans-serif; }
      video { display: none; }
      main { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
      canvas { width: 100%; height: 100%; display: block; }
      #info { position: fixed; left: 16px; top: 12px; font-size: 15px; line-height: 1.7; white-space: pre; text-shadow: 0 0 6px #000; }
      #msg { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; font-size: 20px; color: #4dd0ff; }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <main>
      <canvas id="hands"></canvas>
      <div id="stick"></div>
    </main>
    <div id="info"></div>
    <div id="msg"></div>
    <script type="module" src="/src/tools/ballstickTest.js"></script>
  </body>
</html>
