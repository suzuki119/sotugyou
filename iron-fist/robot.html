<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ロボット アニメーション確認</title>
    <style>
      :root { --panel: rgba(12, 20, 28, 0.9); --line: #2f4a5c; --text: #e6eef5; --muted: #8fa3b8; --accent: #4dd0ff; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1218; color: var(--text); font-family: -apple-system, "Hiragino Sans", sans-serif; }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; }
      aside {
        position: fixed; top: 12px; left: 12px; width: 230px; padding: 14px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 13px;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      h2 { font-size: 12px; color: var(--muted); font-weight: normal; margin: 14px 0 6px; }
      button {
        font: inherit; color: var(--text); background: #1b2731; border: 1px solid var(--line);
        border-radius: 5px; padding: 5px 8px; cursor: pointer; text-align: left;
      }
      button:hover { border-color: var(--accent); }
      button.active { background: var(--accent); color: #0d1218; border-color: var(--accent); font-weight: bold; }
      .clips { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .clips kbd { float: right; opacity: 0.6; font-family: inherit; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      select, input[type="range"] { flex: 1; }
      select { font: inherit; background: #1b2731; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px; }
      .note { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 12px 0 0; }
      #timeline {
        position: fixed; left: 260px; right: 12px; bottom: 12px; padding: 10px 14px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        display: flex; gap: 12px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums;
      }
      #seek { flex: 1; }
      #time { min-width: 170px; text-align: right; }
      #play { width: 64px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <aside>
      <h1>ロボット アニメーション確認</h1>
      <h2>クリップ</h2>
      <div class="clips" id="clips">読み込み中…</div>
      <h2>ハッチ</h2>
      <div class="row">
        <button id="hatchOpen">開く (O)</button>
        <button id="hatchClose">閉じる (C)</button>
      </div>
      <h2>再生</h2>
      <div class="row"><label><input type="checkbox" id="loop" checked /> ループ (L)</label></div>
      <div class="row">速さ <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1" /> <span id="speedText">1.0×</span></div>
      <h2>カメラ</h2>
      <div class="row">
        <select id="shot">
          <option value="free">自由（ドラッグで回転）</option>
          <option value="title">ゲーム内：タイトル</option>
          <option value="mount">ゲーム内：搭乗</option>
          <option value="victory">ゲーム内：クリア</option>
          <option value="defeat">ゲーム内：ゲームオーバー</option>
        </select>
      </div>
      <p class="note">Space：再生／一時停止　← →：1フレーム送り<br />数字キー：クリップ切り替え</p>
    </aside>
    <div id="timeline">
      <button id="play">⏸</button>
      <input type="range" id="seek" min="0" max="1" step="0.001" value="0" />
      <span id="time">-</span>
    </div>
    <script type="module" src="/src/tools/robotViewer.js"></script>
  </body>
</html>
